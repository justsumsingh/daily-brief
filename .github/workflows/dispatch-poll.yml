name: Dispatch Poller

on:
  schedule:
    - cron: "4-59/15 * * * *"   # every 15 min at :04 :19 :34 :49 (off-peak; GitHub drops more runs at :00/:15/:30/:45)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dispatch-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.feed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests cryptography

      - name: Check the feed
        id: feed
        run: python dispatch.py
        env:
          BRIEF_CONFIG: ${{ secrets.BRIEF_CONFIG }}
          STATE_KEY: ${{ secrets.STATE_KEY }}

      - name: Save state (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          if [ -f dispatches.json.enc ]; then
            git add dispatches.json.enc
            if ! git diff --cached --quiet; then
              git commit -m "Update state"
              for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
            fi
          fi

  publish:
    # Rebuilds the encrypted dashboard and deploys it to GitHub Pages.
    needs: poll
    if: needs.poll.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the data just saved by the previous job

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - name: Build dashboard
        run: python dashboard.py
        env:
          BRIEF_CONFIG: ${{ secrets.BRIEF_CONFIG }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
